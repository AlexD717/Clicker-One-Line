<!DOCTYPE html><html><head><title>Banana Clicker</title><meta charset="utf-8"><style>body{background:#d4d43d;color:#000000;font-family:sans-serif;text-align:center}h1{font-size:5vh}.not-selectable{user-select:none;-webkit-user-select:none}#click-item{font-size:30vh}</style></head><body><h1>Bananas: <span id="score-display">0</span></h1><div class="not-selectable" id="click-item">🍌</div><script>let e=0;const t=document.getElementById("score-display");document.getElementById("click-item").addEventListener("click",()=>{e++,t.innerHTML=e.toString()});</script></body></html>

<!DOCTYPE html>
<html lang="">
<head>
    <title>Banana Clicker</title>
    <meta charset="utf-8">
    <style>
        body { background: #a69805;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 5vh;
        }

        h2 {
            margin: 3vh;
        }

        button {
            padding: 1vh;
            cursor: pointer;
            color: white;
            background: #d16f0d;
            border: none;
            outline: none;
            border-radius: 10px;
            white-space: pre-line;
        }

        button:active {
            transform: scale(.98);
        }

        button:disabled {
            background: #9f550a;
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .cent-div {
            display: flex;
            justify-content: center;
            gap: 10vh;
        }

        .float {
            position: fixed;
            pointer-events: none;
            animation: floatUp .7s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-40px);
                opacity: 0;
            }
        }

        #click-item {
            font-size: 30vh;
            cursor: pointer;
            display: inline-block;
        }

        #click-item:active {
            transform: scale(.95);
        }

        .vertical-container {
            display: flex;
            flex-direction: column;
            gap: 3vh;
            width: 30vh;
        }
    </style>
</head>
<body>
<h1>Bananas: <span id="score-display">0</span></h1>
<div id="click-item">🍌</div>
<div class="cent-div">
    <div id="click-power-upgrade" class="vertical-container">
        <h2>Click Power: <span id="click-power">1</span></h2>
    </div>
    <div id="increment-upgrade" class="vertical-container">
        <h2>Increment: <span id="increment-per-second">0</span></h2>
    </div>
</div>


<script>
    const clickUpgradeContainer = document.getElementById('click-power-upgrade');
    const incrementUpgradeContainer = document.getElementById('increment-upgrade');

    // Cost, cost multiplier, click power increase, increment per second increase
    let upgrades = [
        // Click upgrades
        [25, 1.2, 1, 0],
        [2000, 1.2, 5, 0],

        // Increment per second upgrades
        [50, 1.4, 0, 1],
        [5000, 1.2, 0, 5],
    ]
    const critChance = 0.1;

    let userData = {
        score: 0,
        clickPower: 1,
        scorePerSecond: 0
    };

    let upgradeButtons = []
    for (let i = 0; i < upgrades.length; i++) {
        const newButton = document.createElement("button");

        let upgradeText;
        if (upgrades[i][2] > 0) {
            upgradeText = "Click Power " + upgrades[i][2];
            clickUpgradeContainer.appendChild(newButton);
        } else {
            upgradeText = "Increment per Second " + upgrades[i][3];
            incrementUpgradeContainer.appendChild(newButton);
        }
        upgradeText += "\nCost: "

        newButton.textContent = `${upgradeText}${upgrades[i][0]}`;

        newButton.addEventListener("click", () => {
            buyUpgrade(i);
        })

        upgradeButtons.push({
            element: newButton,
            baseText: upgradeText
        });
    }

    let lastUpdateTime = 0;

    const scoreDisplay = document.getElementById('score-display');
    const clickPowerDisplay = document.getElementById('click-power');
    const incrementPowerDisplay = document.getElementById('increment-per-second');
    const bananaButton = document.getElementById('click-item');

    bananaButton.addEventListener('click', (e) => {
        const crit = Math.random() < critChance ? 5 : 1;
        const scoreIncrease = userData.clickPower * crit;
        userData.score += scoreIncrease;
        updateUI();

        const jitterX = e.clientX + (Math.random() * 20 - 15);
        const jitterY = e.clientY - 15;
        popText((crit > 1 ? "CRIT! " : "") + `+${scoreIncrease}`, jitterX, jitterY, crit > 1);
    });

    function buyUpgrade(upgradeIndex) {
        if (userData.score >= upgrades[upgradeIndex][0]) {
            userData.score -= upgrades[upgradeIndex][0];
            upgrades[upgradeIndex][0] *= upgrades[upgradeIndex][1]; // Increase cost of upgrade
            userData.clickPower += upgrades[upgradeIndex][2];
            userData.scorePerSecond += upgrades[upgradeIndex][3];
            updateUI();
        }
    }

    function autoIncrementScore(currentTime) {
        if (!lastUpdateTime) lastUpdateTime = currentTime;
        const deltaT = (currentTime - lastUpdateTime) / 1000;
        lastUpdateTime = currentTime;

        userData.score += userData.scorePerSecond * deltaT;
        updateUI();

        requestAnimationFrame(autoIncrementScore);
    }
    requestAnimationFrame(autoIncrementScore);

    function updateUI() {
        scoreDisplay.innerHTML = userData.score.toFixed(0);

        clickPowerDisplay.innerHTML = userData.clickPower;
        incrementPowerDisplay.innerHTML = userData.scorePerSecond;

        for (let i = 0; i < upgrades.length; i++) {
            let cost = upgrades[i][0];
            let buttonObj = upgradeButtons[i];

            buttonObj.element.textContent = `${buttonObj.baseText}${Math.ceil(cost)}`;
            buttonObj.element.disabled = userData.score < cost;
        }
    }

    function popText(txt, x, y, isCrit) {
        const element = document.createElement("span");
        element.className = "float";
        element.textContent = txt;
        element.style.cssText = `left:${x}px;top:${y}px`;
        element.style.fontSize = "2rem";

        if (isCrit) {
            element.style.color = "#c35b10";
            element.style.fontWeight = "bold";
            element.style.fontSize = "2.5rem";
        }

        document.body.appendChild(element);

        setTimeout(() => element.remove(), 700)
    }
</script>
</body>
</html>

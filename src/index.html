<!DOCTYPE html>
<html lang="">
<head>
    <title>Banana Clicker</title>
    <meta charset="utf-8">
    <style>
        body { background: #a69805;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 5vh;
        }

        h2 {
            margin: 3vh;
        }

        button {
            padding: 1vh;
            cursor: pointer;
            color: #ffffff;
            background: #d16f0d;
            border: none;
            outline: none;
            border-radius: 10px;
            white-space: pre-line;
        }

        button:active {
            transform: scale(.98);
        }

        .cent-div {
            display: flex;
            justify-content: center;
            gap: 10vh;
        }

        #click-item {
            font-size: 30vh;
            cursor: pointer;
            display: inline-block;
        }

        #click-item:active {
            transform: scale(.95);
        }

        .vertical-container {
            display: flex;
            flex-direction: column;
            gap: 3vh;
            width: 30vh;
        }
    </style>
</head>
<body>
<h1>Bananas: <span id="score-display">0</span></h1>
<div id="click-item">🍌</div>
<div class="cent-div">
    <div id="click-power-upgrade" class="vertical-container">
        <h2>Click Power: <span id="click-power">1</span></h2>
    </div>
    <div id="increment-upgrade" class="vertical-container">
        <h2>Increment: <span id="increment-per-second">0</span></h2>
    </div>
</div>


<script>
    const clickUpgradeContainer = document.getElementById('click-power-upgrade');
    const incrementUpgradeContainer = document.getElementById('increment-upgrade');

    // Name, cost, cost multiplier, click power increase, increment per second increase
    const upgrades = [
        // Click upgrades
        [50, 1.2, 1, 0],
        [2000, 1.2, 5, 0],

        // Increment per second upgrades
        [50, 1.4, 0, 1],
        [5000, 1.2, 0, 5],
    ]

    let userData = {
        score: 0,
        clickPower: 1,
        scorePerSecond: 2
    };

    for (let i = 0; i < upgrades.length; i++) {
        const newButton = document.createElement("button");

        let upgradeText;
        if (upgrades[i][2] > 0) {
            upgradeText = "Click Power " + upgrades[i][2];
            clickUpgradeContainer.appendChild(newButton);
        } else {
            upgradeText = "Increment per Second " + upgrades[i][3];
            incrementUpgradeContainer.appendChild(newButton);
        }

        newButton.textContent = `${upgradeText}\nCost: ${upgrades[i][0]}`;

        newButton.addEventListener("click", () => {
            buyUpgrade(upgrades[i][0], upgrades[i][2], upgrades[i][3]);
        })
    }

    let lastUpdateTime = 0;

    const scoreDisplay = document.getElementById('score-display');
    const clickPowerDisplay = document.getElementById('click-power');
    const incrementPowerDisplay = document.getElementById('increment-per-second');
    const bananaButton = document.getElementById('click-item');

    bananaButton.addEventListener('click', () => { userData.score += userData.clickPower; updateUI(); });

    function buyUpgrade(cost, powerIncrease, incrementIncrease) {
        if (userData.score >= cost) {
            userData.score -= cost;
            userData.clickPower += powerIncrease;
            userData.scorePerSecond += incrementIncrease;
            updateUI();
        }
    }

    function autoIncrementScore(currentTime) {
        if (!lastUpdateTime) lastUpdateTime = currentTime;
        const deltaT = (currentTime - lastUpdateTime) / 1000;
        lastUpdateTime = currentTime;

        userData.score += userData.scorePerSecond * deltaT;
        updateUI();

        requestAnimationFrame(autoIncrementScore);
    }
    requestAnimationFrame(autoIncrementScore);

    function updateUI() {
        if (userData.score < 100) {
            scoreDisplay.innerHTML = userData.score.toFixed(2);
        } else {
            scoreDisplay.innerHTML = userData.score.toFixed(0);
        }
        clickPowerDisplay.innerHTML = userData.clickPower;
        incrementPowerDisplay.innerHTML = userData.scorePerSecond;
    }
</script>
</body>
</html>
